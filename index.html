<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isha Khan Road Football</title>
<style>
  :root {
    --turf: #0e3b25;
    --turf-deep: #06190f;
    --chalk: #f3f1e7;
    --gold: #f2b632;
    --text: #f3f1e7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--turf-deep);
    overflow: hidden;
  }

  .stage {
    position: fixed; inset: 0;
    background: var(--turf-deep) url("bg.png") center / cover no-repeat;
  }
  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,.25) 30%, rgba(0,0,0,.7) 100%),
      rgba(0,0,0,.25);
  }

  #landing {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .crest {
    width: 84px; height: 84px; margin-bottom: 22px;
    border-radius: 50%;
    background: var(--chalk);
    display: grid; place-items: center;
    box-shadow: 0 0 0 4px var(--gold), 0 10px 30px rgba(0,0,0,.5);
  }
  .crest img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 4.6rem);
    line-height: 1.05;
    letter-spacing: .01em;
    text-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  .sub {
    margin-top: 14px;
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    color: rgba(243,241,231,.82);
    max-width: 34ch;
  }
  .enter {
    margin-top: 40px;
    font: inherit; font-weight: 700; font-size: 1.1rem; letter-spacing: .04em;
    color: #1a1204;
    background: linear-gradient(180deg, #ffd35e, var(--gold));
    border: 0; border-radius: 999px;
    padding: 16px 44px;
    cursor: pointer;
    box-shadow: 0 8px 0 #a87a14, 0 16px 30px rgba(0,0,0,.45);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .enter:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #a87a14, 0 20px 34px rgba(0,0,0,.5); }
  .enter:active { transform: translateY(6px); box-shadow: 0 2px 0 #a87a14, 0 6px 14px rgba(0,0,0,.5); }
  .enter:focus-visible { outline: 3px solid var(--chalk); outline-offset: 4px; }
  .foot {
    position: absolute; bottom: 18px; left: 0; right: 0;
    font-size: .8rem; color: rgba(243,241,231,.5);
  }

  #player {
    position: fixed; inset: 0; z-index: 10;
    background: #000;
    display: none;
  }
  #player.on { display: block; }
  #player video { width: 100%; height: 100%; object-fit: contain; background: #000; }

</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="vignette"></div>
</div>

<main id="landing">
  <div class="crest" aria-hidden="true">
    <img src="IFC_logo.png" alt="">
  </div>
  <h1>Isha Khan Road Football</h1>
  <p class="sub">Click to view the website, made by Mustafa the Great.</p>
  <button class="enter" id="enterBtn" type="button">Click to enter</button>
  <div class="foot">&copy; Isha Khan Road Football</div>
</main>

<div id="player">
  <video id="vid" playsinline preload="auto"></video>
</div>

<script>
  const VIDEO_SRC = "rickroll.mp4";

  const btn = document.getElementById("enterBtn");
  const player = document.getElementById("player");
  const vid = document.getElementById("vid");

  vid.src = VIDEO_SRC;
  vid.load();

  btn.addEventListener("click", async () => {
    player.classList.add("on");
    try {
      vid.currentTime = 0;
      await vid.play();
      if (player.requestFullscreen) player.requestFullscreen().catch(() => {});
    } catch (e) {
      console.error("Could not play video:", e);
    }
  });

  vid.addEventListener("ended", () => { vid.currentTime = 0; vid.play(); });
</script>
</body>
</html>
